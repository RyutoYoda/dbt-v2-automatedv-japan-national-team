name: dbt_v2_automatedv_japan_national_team
version: 1.0.0
config-version: 2
profile: dv_japan

model-paths: ["models"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  dbt_v2_automatedv_japan_national_team:
    staging:
      +schema: STAGING
      +materialized: view
    raw_vault:
      +schema: RAW_VAULT
      +materialized: incremental
    business_vault:
      +schema: BUSINESS_VAULT
      +materialized: table
    marts:
      +schema: MARTS
      +materialized: table

seeds:
  dbt_v2_automatedv_japan_national_team:
    +schema: RAW
    +quote_columns: false
    statsbomb_matches:
      +column_types:
        match_id: NUMBER(38,0)
        season_id: NUMBER(38,0)
        home_team_id: NUMBER(38,0)
        away_team_id: NUMBER(38,0)
        home_score: NUMBER(38,0)
        away_score: NUMBER(38,0)
    statsbomb_lineups:
      +column_types:
        match_id: NUMBER(38,0)
        team_id: NUMBER(38,0)
        player_id: NUMBER(38,0)
        jersey_number: NUMBER(38,0)
    statsbomb_shots:
      +column_types:
        match_id: NUMBER(38,0)
        event_id: STRING
        period: NUMBER(38,0)
        minute: NUMBER(38,0)
        second: NUMBER(38,0)
        team_id: NUMBER(38,0)
        player_id: NUMBER(38,0)
        shot_xg: FLOAT
    training_player_identity_map:
      +column_types:
        statsbomb_player_id: NUMBER(38,0)

vars:
  automate_dv.hash: MD5
