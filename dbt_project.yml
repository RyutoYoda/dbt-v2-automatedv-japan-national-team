name: dbt_v2_automatedv_japan_national_team
version: 1.0.0
config-version: 2
profile: dv_japan

model-paths: ["models"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  dbt_v2_automatedv_japan_national_team:
    staging:
      +schema: STAGING
      +materialized: view
    raw_vault:
      +schema: RAW_VAULT
      +materialized: incremental
    business_vault:
      +schema: BUSINESS_VAULT
      +materialized: table
    marts:
      +schema: MARTS
      +materialized: table

seeds:
  dbt_v2_automatedv_japan_national_team:
    +schema: RAW
    +quote_columns: false
    statsbomb_matches:
      +column_types:
        match_id: BIGINT
        season_id: BIGINT
        competition_id: BIGINT
        home_team_id: BIGINT
        away_team_id: BIGINT
        home_score: INT
        away_score: INT
        season_name: STRING
    statsbomb_lineups:
      +column_types:
        match_id: BIGINT
        team_id: BIGINT
        player_id: BIGINT
        jersey_number: INT
    statsbomb_shots:
      +column_types:
        match_id: BIGINT
        event_id: STRING
        period: INT
        minute: INT
        second: INT
        team_id: BIGINT
        player_id: BIGINT
        shot_xg: DOUBLE
    training_player_identity_map:
      +column_types:
        statsbomb_player_id: BIGINT

vars:
  automate_dv.hash: MD5
