      - name: COMPETITION_ID
        description: "StatsBombの大会業務キー。"
      - name: LOAD_DATETIME
        description: "Hubレコードの初回ロード日時。"
      - name: RECORD_SOURCE
        description: "Hubレコードのデータ起源。"

  - name: hub_match
