version: 2

models:
  - name: v_stg_matches
    description: "StatsBombの試合ソースを型変換し、Data Vault用のハッシュキーと変更検知値を付与するステージングビュー。1行は1試合。"
    columns:
      - name: match_id
        description: "StatsBombの試合識別子。"
      - name: season_name
        description: "大会シーズン名。対象データは2022年。"
      - name: match_date
        description: "試合開催日。"
      - name: competition_id
        description: "StatsBombの大会識別子。"
      - name: competition_name
        description: "大会名。"
      - name: home_team_id
        description: "ホームチームのStatsBomb識別子。"
      - name: home_team_name
        description: "ホームチーム名。"
      - name: home_score
        description: "ホームチームの得点。"
      - name: away_team_id
        description: "アウェイチームのStatsBomb識別子。"
      - name: away_team_name
        description: "アウェイチーム名。"
      - name: away_score
        description: "アウェイチームの得点。"
      - name: stage_name
        description: "大会内の試合ステージ。"
      - name: stadium_name
        description: "試合会場名。"
      - name: record_source
        description: "レコードの取得元を示す識別子。"
      - name: load_datetime
        description: "ソース行を取り込んだ日時。"
      - name: match_hk
        description: "match_idから生成したMatch Hub用ハッシュキー。"
      - name: competition_hk
        description: "competition_idから生成したCompetition Hub用ハッシュキー。"
      - name: home_team_hk
        description: "home_team_idから生成したホームTeam Hub用ハッシュキー。"
      - name: away_team_hk
        description: "away_team_idから生成したアウェイTeam Hub用ハッシュキー。"
      - name: match_hashdiff
        description: "試合Satelliteの属性変更検知に使うハッシュ差分。"

  - name: v_stg_lineups
    description: "StatsBombの出場選手データを型変換し、選手・試合・チームのキーを付与するステージングビュー。1行は1選手の1試合出場記録。"
    columns:
      - name: match_id
        description: "StatsBombの試合識別子。"
      - name: team_id
        description: "所属チームのStatsBomb識別子。"
      - name: team_name
        description: "所属チーム名。"
      - name: player_id
        description: "選手のStatsBomb識別子。"
      - name: player_name
        description: "ソース上の選手名。"
      - name: jersey_number
        description: "試合での背番号。"
      - name: position_name
        description: "出場時のポジション名。"
      - name: is_starter
        description: "先発出場ならtrue。"
      - name: record_source
        description: "レコードの取得元を示す識別子。"
      - name: load_datetime
        description: "ソース行を取り込んだ日時。"
      - name: match_hk
        description: "試合識別子から生成したMatch Hub用ハッシュキー。"
      - name: team_hk
        description: "チーム識別子から生成したTeam Hub用ハッシュキー。"
      - name: player_source_hk
        description: "StatsBomb選手識別子から生成したPlayer Source Hub用ハッシュキー。"
      - name: player_hk
        description: "名寄せ後の選手識別子から生成したPlayer Hub用ハッシュキー。"
      - name: player_match_hk
        description: "選手・試合・チームの組み合わせを表すLink用ハッシュキー。"
      - name: lineup_hashdiff
        description: "背番号・ポジション・先発区分の変更検知に使うハッシュ差分。"

  - name: v_stg_players
    description: "トレーニング用選手名寄せ表を整形し、StatsBomb選手IDと統合選手IDのハッシュキーを作るビュー。"
    columns:
      - name: player_source_id
        description: "StatsBomb側の選手識別子。"
      - name: training_registry_id
        description: "演習用の選手台帳識別子。実在する公式IDではない。"
      - name: master_player_id
        description: "演習用に統合した選手識別子。"
      - name: player_name
        description: "名寄せ後に表示する選手名。"
      - name: record_source
        description: "名寄せレコードの取得元を示す識別子。"
      - name: load_datetime
        description: "レコードを取り込んだ日時。"
      - name: player_source_hk
        description: "StatsBomb選手識別子から生成したPlayer Source Hub用ハッシュキー。"
      - name: player_hk
        description: "統合選手識別子から生成したPlayer Hub用ハッシュキー。"
      - name: same_as_player_hk
        description: "統合選手とStatsBomb選手の対応を表すSame-as Link用ハッシュキー。"
      - name: player_hashdiff
        description: "選手名と演習用台帳IDの変更検知に使うハッシュ差分。"

  - name: v_stg_shots
    description: "StatsBombのシュートイベントを型変換し、イベントと関連する選手・試合・チームのキーを付与するビュー。"
    columns:
      - name: event_id
        description: "StatsBombイベント識別子。"
      - name: match_id
        description: "イベントが発生した試合の識別子。"
      - name: team_id
        description: "シュートを行ったチームの識別子。"
      - name: player_id
        description: "シュートを行った選手のStatsBomb識別子。"
      - name: period
        description: "試合のピリオド番号。"
      - name: minute
        description: "イベント発生時の試合経過分。"
      - name: second
        description: "イベント発生時の分内秒。"
      - name: event_timestamp
        description: "イベント発生時刻のソース表現。"
      - name: shot_type
        description: "シュートの種類。"
      - name: shot_outcome
        description: "シュートの結果。"
      - name: shot_xg
        description: "StatsBombが提供するシュートの期待得点値。"
      - name: record_source
        description: "レコードの取得元を示す識別子。"
      - name: load_datetime
        description: "ソース行を取り込んだ日時。"
      - name: match_hk
        description: "試合識別子から生成したMatch Hub用ハッシュキー。"
      - name: team_hk
        description: "チーム識別子から生成したTeam Hub用ハッシュキー。"
      - name: player_source_hk
        description: "選手識別子から生成したPlayer Source Hub用ハッシュキー。"
      - name: event_hk
        description: "イベント識別子から生成したイベント用ハッシュキー。"

  - name: v_stg_teams
    description: "試合とラインアップからチーム識別子・名称をまとめ、Team Hub用ハッシュキーを付与するビュー。"
    columns:
      - name: team_id
        description: "StatsBombのチーム識別子。"
      - name: team_name
        description: "ソース上のチーム名。"
      - name: load_datetime
        description: "元レコードを取り込んだ日時。"
      - name: record_source
        description: "レコードの取得元を示す識別子。"
      - name: team_hk
        description: "team_idから生成したTeam Hub用ハッシュキー。"
      - name: team_hashdiff
        description: "チーム名の変更検知に使うハッシュ差分。"

  - name: v_stg_player_competition
    description: "選手の大会参加期間を試合記録から集約し、選手・大会Linkと有効期間を作るビュー。"
    columns:
      - name: player_competition_hk
        description: "選手と大会の組み合わせを表すLink用ハッシュキー。"
      - name: player_hk
        description: "Player Hubのハッシュキー。"
      - name: competition_hk
